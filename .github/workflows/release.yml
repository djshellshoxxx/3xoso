name: Release plugins
on:
  push:
    branches: [main]
    paths: ['plugin/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl-dev
      - name: Build VST3, CLAP and Standalone
        run: |
          cmake -S plugin -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j4
      - name: Package
        run: |
          A=build/ThreeXOSO_artefacts/Release
          mkdir -p dist/3xOSO-linux
          cp -r $A/VST3/3xOSO.vst3 $A/CLAP/3xOSO.clap $A/Standalone/3xOSO dist/3xOSO-linux/
          cp README.md dist/3xOSO-linux/
          tar -C dist -czf 3xOSO-1.0-linux-x86_64.tar.gz 3xOSO-linux
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: 3xOSO-1.0-linux-x86_64.tar.gz }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build VST3, CLAP and Standalone
        run: |
          cmake -S plugin -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j4
      - name: Package
        shell: pwsh
        run: |
          $A = "build/ThreeXOSO_artefacts/Release"
          New-Item -ItemType Directory dist/3xOSO-windows | Out-Null
          Copy-Item -Recurse "$A/VST3/3xOSO.vst3" dist/3xOSO-windows/
          Copy-Item "$A/CLAP/3xOSO.clap" dist/3xOSO-windows/
          Copy-Item "$A/Standalone/3xOSO.exe" dist/3xOSO-windows/
          Copy-Item README.md dist/3xOSO-windows/
          Compress-Archive -Path dist/3xOSO-windows -DestinationPath 3xOSO-1.0-windows-x64.zip
          Copy-Item "$A/Standalone/3xOSO.exe" 3xOSO-1.0-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "3xOSO-1.0-windows-x64.*" }
  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0
        run: |
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "3xOSO $TAG" --notes "3xOSO v1.0 — VST3, CLAP, Windows .exe and Linux builds. By Circuit Drift Labs." || gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
