name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check app.js
        run: node --check app.js
      - name: Check site files exist
        run: test -f index.html && test -f style.css && test -f app.js
